apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  namespace: todo
  labels:
    app.kubernetes.io/name: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo
    spec:
      containers:
        - name: vikunja
          image: ${TODO_IMAGE}
          ports:
            - name: http
              containerPort: 3456
          env:
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "http://todo.${LAB_DOMAIN}:${WORK_HTTP_PORT}/"
            - name: VIKUNJA_DATABASE_TYPE
              value: "sqlite"
            - name: VIKUNJA_DATABASE_PATH
              value: "/db/vikunja.db"
          volumeMounts:
            - name: db
              mountPath: /db
            - name: files
              mountPath: /app/vikunja/files
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: db
          emptyDir: {}
        - name: files
          emptyDir: {}
